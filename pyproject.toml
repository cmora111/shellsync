[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shellsync"
version = "0.1.0"
description = "Synchronize shell configuration files across Linux hosts"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.5",
]

[project.scripts]
sync = "shellsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
